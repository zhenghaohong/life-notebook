<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="color-scheme" content="only light"><meta name="theme-color" content="#f5f5f7"><meta name="description" content="私人的日常记账与双语日记"><title>日常 · Life Notebook</title><link rel="stylesheet" href="style.css?v=reminders-1"><script src="config.js?v=reminders-1" defer></script><script src="app.js?v=reminders-1" defer></script></head><body>
<aside><a class="brand" href="#home"><span class="logo">◒</span> 日常<span class="brand-sub">LIFE NOTEBOOK</span></a><nav aria-label="主导航"></nav><div class="aside-foot">留一点空间，给生活。</div></aside>
<main><header><div><div class="eyebrow">YOUR EVERYDAY, SIMPLIFIED</div><h1 id="title">首页</h1></div><label class="date-label">日期<input id="date" type="date" required></label></header><div id="status" role="status"></div><section id="content" aria-live="polite"></section><footer>每一笔，每一天。<span id="mode"></span></footer></main><dialog id="modal"><form id="cost-form"><h2>记录一笔</h2><input name="id" type="hidden"><label>金额<input name="amount" type="number" min="0.01" max="99999999" step="0.01" inputmode="decimal" required></label><label>标签<select name="tag" required></select></label><label>备注<input name="note" maxlength="500" placeholder="这笔支出是什么？"></label><label>时间<input name="time" type="time" required></label><div class="actions"><button type="button" id="cancel" class="secondary">取消</button><button type="submit">保存</button></div></form></dialog>
<dialog id="reminder-modal"><form id="reminder-form"><h2 id="reminder-form-title">添加事项</h2><p id="reminder-error" role="alert"></p><input name="id" type="hidden"><label>事项名称<input name="title" maxlength="120" placeholder="例如：续费服务器" required></label><label>到期日期<input name="dueDate" type="date" required></label><label>备注（选填）<textarea name="note" maxlength="2000" placeholder="补充说明或需要准备的内容"></textarea></label><div class="actions"><button type="button" id="reminder-cancel" class="secondary">取消</button><button type="submit">保存事项</button></div></form></dialog><script src="reminders.js?v=reminders-1" defer></script></body></html>
